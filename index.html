<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>املاک من</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}header{position:sticky;top:0;background:#2563eb;color:#fff;padding:14px;display:flex;justify-content:space-between;z-index:5}h1{font-size:19px;margin:0}.wrap{padding:12px 12px 80px;max-width:1100px;margin:auto}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.kpi{font-size:25px;font-weight:bold;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:10px;padding:10px 13px;background:#e5e7eb;font-family:inherit}.primary{background:#2563eb;color:white}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font-family:inherit;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:4px}label{font-size:12px;color:#4b5563}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:12px}.bottom{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}.bottom button{flex:1;border:0;background:none;padding:8px 2px;font-family:inherit;font-size:11px}.bottom button.active{color:#2563eb;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.empty{text-align:center;color:#6b7280;padding:28px}.muted{color:#6b7280;font-size:12px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>🏠 املاک من</h1><button id="install" class="btn" style="display:none">نصب برنامه</button></header>
<div class="wrap">
<section id="dashboard" class="page active"><h2>داشبورد</h2><div class="cards">
<div class="card">👥 مشتریان<div id="kc" class="kpi">0</div></div><div class="card">🏠 فایل‌های فعال<div id="kp" class="kpi">0</div></div><div class="card">📞 پیگیری امروز<div id="kf" class="kpi">0</div></div><div class="card">💰 معاملات<div id="kd" class="kpi">0</div></div></div>
<div class="card" style="margin-top:12px"><b>پیگیری‌های امروز</b><div id="today" class="empty">موردی نیست.</div></div></section>
<section id="customers" class="page"><h2>👥 مشتریان</h2><div class="toolbar"><button class="btn primary" onclick="customerForm()">+ مشتری</button><input id="cq" placeholder="جستجو..." oninput="render()"></div><div id="ct"></div></section>
<section id="properties" class="page"><h2>🏠 فایل‌ها</h2><div class="toolbar"><button class="btn primary" onclick="propertyForm()">+ فایل</button><input id="pq" placeholder="جستجو..." oninput="render()"></div><div id="pt"></div></section>
<section id="followups" class="page"><h2>📞 پیگیری‌ها</h2><button class="btn primary" onclick="followupForm()">+ پیگیری</button><div id="ft"></div></section>
<section id="deals" class="page"><h2>💰 معاملات</h2><button class="btn primary" onclick="dealForm()">+ معامله</button><div id="dt"></div></section>
<section id="backup" class="page"><h2>⚙️ پشتیبان</h2><div class="card"><p>اطلاعات فعلاً روی همین گوشی ذخیره می‌شود.</p><button class="btn primary" onclick="backup()">دانلود پشتیبان</button> <label class="btn">بازیابی<input type="file" accept=".json" hidden onchange="restore(event)"></label><button class="btn" onclick="wipe()">حذف اطلاعات</button><p class="muted">بعداً می‌توانیم همگام‌سازی ابری و کاربر دوم اضافه کنیم.</p></div></section>
</div>
<nav class="bottom"><button class="active" data-p="dashboard">🏠<br>خانه</button><button data-p="customers">👥<br>مشتری</button><button data-p="properties">🏢<br>فایل</button><button data-p="followups">📞<br>پیگیری</button><button data-p="deals">💰<br>معامله</button><button data-p="backup">⚙️<br>بیشتر</button></nav>
<div id="modal" class="modal"><div class="box"><div id="mc"></div></div></div>
<script>
const K='amlakman_pwa_v1';let db=JSON.parse(localStorage.getItem(K)||'{"customers":[],"properties":[],"followups":[],"deals":[]}');
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function iid(){return Date.now()+Math.random()}function nav(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.p===p))}document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>nav(b.dataset.p));
function modal(s){$('mc').innerHTML=s;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}
function customerForm(x={}){modal(`<h3>مشتری</h3><form onsubmit="add(event,'customers','${x.id||''}')"><div class="formgrid"><div class="field"><label>نام</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>موبایل</label><input name="phone" value="${esc(x.phone)}"></div><div class="field"><label>نوع</label><select name="type">${['خریدار','فروشنده','موجر','مستأجر','سازنده','سرمایه‌گذار'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>وضعیت</label><select name="status">${['داغ','گرم','فعال','سرد','معامله‌شده'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>محدوده</label><input name="area" value="${esc(x.area)}"></div><div class="field"><label>بودجه</label><input name="budget" value="${esc(x.budget)}"></div><div class="field"><label>پیگیری بعدی</label><input type="date" name="next" value="${esc(x.next)}"></div><div class="field"><label>نیاز</label><input name="need" value="${esc(x.need)}"></div><div class="field full"><label>یادداشت</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><button class="btn primary">ذخیره</button></form>`)}
function propertyForm(x={}){modal(`<h3>فایل ملکی</h3><form onsubmit="add(event,'properties','${x.id||''}')"><div class="formgrid"><div class="field"><label>نوع</label><select name="type"><option>فروش</option><option>اجاره</option><option>رهن کامل</option><option>مشارکت</option></select></div><div class="field"><label>منطقه/محله</label><input name="area" required value="${esc(x.area)}"></div><div class="field"><label>متراژ</label><input name="meter" value="${esc(x.meter)}"></div><div class="field"><label>خواب</label><input name="bed" value="${esc(x.bed)}"></div><div class="field"><label>قیمت/ودیعه</label><input name="price" value="${esc(x.price)}"></div><div class="field"><label>اجاره</label><input name="rent" value="${esc(x.rent)}"></div><div class="field"><label>مالک</label><input name="owner" value="${esc(x.owner)}"></div><div class="field"><label>موبایل مالک</label><input name="phone" value="${esc(x.phone)}"></div><div class="field"><label>پارکینگ</label><input name="parking" value="${esc(x.parking)}"></div><div class="field"><label>انباری</label><input name="storage" value="${esc(x.storage)}"></div><div class="field"><label>سن بنا</label><input name="age" value="${esc(x.age)}"></div><div class="field"><label>وضعیت</label><select name="status"><option>فعال</option><option>بازدید</option><option>مذاکره</option><option>رزرو</option><option>معامله شد</option><option>بایگانی</option></select></div><div class="field full"><label>آدرس</label><input name="address" value="${esc(x.address)}"></div><div class="field full"><label>توضیحات</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><button class="btn primary">ذخیره</button></form>`)}
function followupForm(x={}){modal(`<h3>پیگیری</h3><form onsubmit="add(event,'followups','${x.id||''}')"><div class="formgrid"><div class="field"><label>موضوع</label><input name="title" required value="${esc(x.title)}"></div><div class="field"><label>شخص</label><input name="person" value="${esc(x.person)}"></div><div class="field"><label>تاریخ</label><input type="date" name="date" value="${esc(x.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>وضعیت</label><select name="status"><option>باز</option><option>انجام شد</option></select></div><div class="field full"><label>یادداشت</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><button class="btn primary">ذخیره</button></form>`)}
function dealForm(x={}){modal(`<h3>معامله</h3><form onsubmit="add(event,'deals','${x.id||''}')"><div class="formgrid"><div class="field"><label>نوع</label><select name="type"><option>اجاره</option><option>فروش</option><option>رهن</option></select></div><div class="field"><label>ملک</label><input name="property" value="${esc(x.property)}"></div><div class="field"><label>طرفین</label><input name="parties" value="${esc(x.parties)}"></div><div class="field"><label>مبلغ معامله</label><input name="amount" value="${esc(x.amount)}"></div><div class="field"><label>کمیسیون کل</label><input name="commission" type="number" value="${esc(x.commission)}"></div><div class="field"><label>سهم من ۵۰٪</label><input name="share" value="${esc(x.share)}"></div><div class="field"><label>کد رهگیری</label><input name="tracking" value="${esc(x.tracking)}"></div></div><button class="btn primary">ذخیره</button></form>`)}
function add(e,t,old){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=old||iid();let i=db[t].findIndex(x=>x.id==o.id);if(i>=0)db[t][i]=o;else db[t].unshift(o);closeM();save()}function del(t,i){if(confirm('حذف شود؟')){db[t].splice(i,1);save()}}
function render(){ $('kc').textContent=db.customers.length;$('kp').textContent=db.properties.filter(x=>x.status!=='بایگانی'&&x.status!=='معامله شد').length;let today=new Date().toISOString().slice(0,10),fu=db.followups.filter(x=>x.date===today&&x.status!=='انجام شد');$('kf').textContent=fu.length;$('kd').textContent=db.deals.length;$('today').innerHTML=fu.length?fu.map(x=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${esc(x.title)}</b> — ${esc(x.person)}</div>`).join(''):'موردی نیست.';
let cq=($('cq')?.value||'').toLowerCase(),ca=db.customers.filter(x=>JSON.stringify(x).toLowerCase().includes(cq));$('ct').innerHTML=ca.length?`<table><tr><th>نام</th><th>نوع</th><th>محدوده</th><th>وضعیت</th><th></th></tr>${ca.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.phone)}</td><td>${esc(x.type)}</td><td>${esc(x.area)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick='customerForm(${JSON.stringify(x)})'>ویرایش</button></td></tr>`).join('')}</table>`:'<div class="empty">مشتری ثبت نشده.</div>';
let pq=($('pq')?.value||'').toLowerCase(),pa=db.properties.filter(x=>JSON.stringify(x).toLowerCase().includes(pq));$('pt').innerHTML=pa.length?`<table><tr><th>نوع</th><th>منطقه</th><th>متراژ</th><th>مالک</th><th>قیمت</th></tr>${pa.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.area)}</td><td>${esc(x.meter)}</td><td>${esc(x.owner)}<br>${esc(x.phone)}</td><td>${esc(x.price)} ${x.rent?'/ '+esc(x.rent):''}</td></tr>`).join('')}</table>`:'<div class="empty">فایلی ثبت نشده.</div>';
$('ft').innerHTML=db.followups.map((x,i)=>`<div class="card" style="margin:7px 0"><b>${esc(x.title)}</b> — ${esc(x.person)}<br>${esc(x.date)} | ${esc(x.status)} <button class="btn" style="float:left" onclick="del('followups',${i})">حذف</button></div>`).join('')||'<div class="empty">پیگیری ثبت نشده.</div>';
$('dt').innerHTML=db.deals.map((x,i)=>`<div class="card" style="margin:7px 0"><b>${esc(x.type)}</b> — ${esc(x.property)}<br>کمیسیون: ${esc(x.commission)} | سهم من: ${esc(x.share)} <button class="btn" style="float:left" onclick="del('deals',${i})">حذف</button></div>`).join('')||'<div class="empty">معامله ثبت نشده.</div>'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='amlakman-backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('بازیابی شد')}catch{alert('فایل نامعتبر است')}};r.readAsText(e.target.files[0])}function wipe(){if(confirm('همه اطلاعات حذف شود؟')){db={customers:[],properties:[],followups:[],deals:[]};save()}}
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='block'});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
