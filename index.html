<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>املاک من ۲</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;font-family:Tahoma,Arial;color:#172033}header{background:#2563eb;color:white;padding:14px;position:sticky;top:0;z-index:2}main{padding:12px 12px 75px;max-width:1000px;margin:auto}.page{display:none}.page.on{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:white;border:1px solid #ddd;border-radius:13px;padding:12px;margin:8px 0}.num{font-size:23px;font-weight:bold}.btn{border:0;border-radius:8px;padding:9px 12px;margin:3px;font-family:inherit;background:#e5e7eb}.primary{background:#2563eb;color:white}input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-family:inherit}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;overflow:auto;z-index:5}.bottom button{min-width:68px;border:0;background:white;padding:7px 2px;font:10px Tahoma}.bottom .sel{color:#2563eb;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:flex-end}.modal.on{display:flex}.box{background:white;width:100%;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:7px;border-bottom:1px solid #eee;font-size:11px;text-align:right;vertical-align:top}.tag{padding:3px 7px;border-radius:20px;background:#dcfce7;font-size:10px}.hot{background:#fee2e2}.muted{font-size:11px;color:#777}</style>
<body><header>🏠 املاک من — نسخه ۲</header><main>
<section id="home" class="page on"><h2>داشبورد</h2><div class="cards"><div class="card">👥 مشتریان<div id="nC" class="num">0</div></div><div class="card">🏢 فایل فعال<div id="nP" class="num">0</div></div><div class="card">📞 پیگیری<div id="nF" class="num">0</div></div><div class="card">💰 سهم من<div id="nI" class="num">0</div></div></div><h3>🔥 مشتریان داغ</h3><div id="hot"></div></section>
<section id="customers" class="page"><h2>👥 مشتریان</h2><button class="btn primary" onclick="customerForm()">+ مشتری</button><input id="cq" placeholder="جستجو..." oninput="render()"><div id="ct"></div></section>
<section id="properties" class="page"><h2>🏢 فایل‌ها</h2><button class="btn primary" onclick="propertyForm()">+ فایل</button><input id="pq" placeholder="جستجو..." oninput="render()"><div id="pt"></div></section>
<section id="matches" class="page"><h2>🔎 تطبیق مشتری و فایل</h2><select id="selP" onchange="matches()"></select><div id="mt"></div></section>
<section id="followups" class="page"><h2>📞 پیگیری</h2><button class="btn primary" onclick="simple('followups','پیگیری',['موضوع','شخص','تاریخ'])">+ پیگیری</button><div id="ft"></div></section>
<section id="visits" class="page"><h2>👁️ بازدید</h2><button class="btn primary" onclick="simple('visits','بازدید',['مشتری','فایل','تاریخ','نتیجه'])">+ بازدید</button><div id="vt"></div></section>
<section id="deals" class="page"><h2>💰 معاملات</h2><button class="btn primary" onclick="simple('deals','معامله',['نوع','فایل/کد','مبلغ معامله','کمیسیون کل','سهم من','کد رهگیری','تاریخ'])">+ معامله</button><div id="dt"></div></section>
<section id="reports" class="page"><h2>📊 گزارش درآمد</h2><div id="rep"></div></section>
<section id="backup" class="page"><h2>⚙️ پشتیبان</h2><button class="btn primary" onclick="backup()">دانلود پشتیبان</button><label class="btn">بازیابی<input type="file" hidden accept=".json" onchange="restore(event)"></label><button class="btn" onclick="wipe()">حذف همه</button></section>
</main><nav class="bottom"><button data-p="home">🏠<br>خانه</button><button data-p="customers">👥<br>مشتری</button><button data-p="properties">🏢<br>فایل</button><button data-p="matches">🔎<br>تطبیق</button><button data-p="followups">📞<br>پیگیری</button><button data-p="visits">👁️<br>بازدید</button><button data-p="deals">💰<br>معامله</button><button data-p="reports">📊<br>گزارش</button><button data-p="backup">⚙️<br>پشتیبان</button></nav>
<div id="modal" class="modal"><div class="box" id="box"></div></div>
<script>
const K='amlakman_v2';let d=JSON.parse(localStorage.getItem(K)||'{"customers":[],"properties":[],"followups":[],"visits":[],"deals":[]}');const $=x=>document.getElementById(x),E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>{localStorage.setItem(K,JSON.stringify(d));render()};const close=()=>$('modal').classList.remove('on');
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.p).classList.add('on');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
function form(t,title,fields,x={}){$('box').innerHTML='<h3>'+title+'</h3><form onsubmit="add(event,''+t+'',''+(x.id||'')+'')"><div class="grid">'+fields.map(f=>'<div class="'+(f.full?'full':'')+'"><label>'+f.n+'</label><input name="'+f.k+'" value="'+E(x[f.k])+'"></div>').join('')+'</div><button class="btn primary">ذخیره</button></form>';$('modal').classList.add('on')}
function customerForm(x={}){form('customers','👤 مشتری و نیاز ملکی',[{n:'نام *',k:'name'},{n:'موبایل',k:'phone'},{n:'نوع مشتری',k:'type'},{n:'وضعیت (داغ/گرم/فعال/سرد)',k:'status'},{n:'منبع',k:'source'},{n:'پیگیری بعدی',k:'next'},{n:'نوع نیاز (خرید/اجاره/فروش/رهن)',k:'dealType'},{n:'محله',k:'area'},{n:'حداقل متراژ',k:'minMeter'},{n:'حداکثر متراژ',k:'maxMeter'},{n:'حداقل خواب',k:'minBed'},{n:'حداکثر خواب',k:'maxBed'},{n:'طبقه مطلوب',k:'floor'},{n:'حداکثر سن بنا',k:'maxAge'},{n:'پارکینگ',k:'parking'},{n:'انباری',k:'storage'},{n:'آسانسور',k:'elevator'},{n:'بالکن',k:'balcony'},{n:'حداکثر بودجه خرید',k:'buyBudget'},{n:'حداکثر رهن',k:'deposit'},{n:'حداکثر اجاره',k:'rent'},{n:'سایر شروط',k:'needNotes',full:true},{n:'یادداشت',k:'notes',full:true}],x)}
function propertyForm(x={}){form('properties','🏢 فایل ملکی',[{n:'کد فایل',k:'code'},{n:'نوع معامله',k:'dealType'},{n:'نوع ملک',k:'propertyType'},{n:'محله *',k:'area'},{n:'متراژ',k:'meter'},{n:'خواب',k:'bed'},{n:'طبقه',k:'floor'},{n:'تعداد طبقات',k:'floors'},{n:'تعداد واحد',k:'units'},{n:'سال ساخت',k:'year'},{n:'پارکینگ',k:'parking'},{n:'انباری',k:'storage'},{n:'آسانسور',k:'elevator'},{n:'بالکن',k:'balcony'},{n:'وضعیت سند',k:'deed'},{n:'قیمت فروش',k:'price'},{n:'رهن',k:'deposit'},{n:'اجاره ماهانه',k:'rent'},{n:'نام مالک',k:'owner'},{n:'موبایل مالک',k:'phone'},{n:'وضعیت فایل',k:'status'},{n:'آدرس/توضیحات',k:'notes',full:true}],x)}
function simple(t,title,names){form(t,title,names.map(n=>({n,k:n})),{})}
function add(e,t,old){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=old||Date.now();let i=d[t].findIndex(x=>x.id==o.id);i<0?d[t].unshift(o):d[t][i]=o;close();save()}
function render(){let cq=($('cq')?.value||'').toLowerCase(),pq=($('pq')?.value||'').toLowerCase();$('nC').textContent=d.customers.length;$('nP').textContent=d.properties.filter(x=>x.status!=='بایگانی'&&x.status!=='معامله شد').length;$('nF').textContent=d.followups.length;$('nI').textContent=d.deals.reduce((s,x)=>s+(Number(x['سهم من'])||0),0).toLocaleString('fa-IR');
$('ct').innerHTML=d.customers.filter(x=>JSON.stringify(x).toLowerCase().includes(cq)).map((x,i)=>'<div class="card"><b>'+E(x.name)+'</b> — '+E(x.phone)+'<br>'+E(x.dealType)+' | '+E(x.area)+' | '+E(x.minMeter)+' تا '+E(x.maxMeter)+' متر | خواب '+E(x.minBed)+'-'+E(x.maxBed)+'<br>رهن: '+E(x.deposit)+' | اجاره: '+E(x.rent)+' | بودجه: '+E(x.buyBudget)+'<br><span class="tag '+(x.status==='داغ'?'hot':'')+'">'+E(x.status)+'</span> <button class="btn" onclick='customerForm('+JSON.stringify(x)+')'>ویرایش</button></div>').join('')||'<div class="card">موردی نیست.</div>';
$('pt').innerHTML=d.properties.filter(x=>JSON.stringify(x).toLowerCase().includes(pq)).map(x=>'<div class="card"><b>'+E(x.code||'-')+'</b> — '+E(x.dealType)+' — '+E(x.area)+'<br>'+E(x.meter)+' متر | '+E(x.bed)+' خواب | طبقه '+E(x.floor)+' | پارکینگ '+E(x.parking)+' | انباری '+E(x.storage)+'<br>فروش: '+E(x.price)+' | رهن: '+E(x.deposit)+' | اجاره: '+E(x.rent)+'<br>مالک: '+E(x.owner)+' '+E(x.phone)+' <button class="btn" onclick='propertyForm('+JSON.stringify(x)+')'>ویرایش</button></div>').join('')||'<div class="card">فایلی نیست.</div>';
$('hot').innerHTML=d.customers.filter(x=>x.status==='داغ').map(x=>'<div class="card">🔥 <b>'+E(x.name)+'</b> — '+E(x.phone)+'<br>'+E(x.dealType)+' | '+E(x.area)+'</div>').join('')||'<div class="card">مشتری داغی ثبت نشده.</div>';
$('ft').innerHTML=d.followups.map(x=>'<div class="card">'+Object.values(x).map(E).join(' | ')+'</div>').join('')||'<div class="card">پیگیری ندارید.</div>';$('vt').innerHTML=d.visits.map(x=>'<div class="card">'+Object.values(x).map(E).join(' | ')+'</div>').join('')||'<div class="card">بازدید ندارید.</div>';$('dt').innerHTML=d.deals.map(x=>'<div class="card">'+Object.values(x).map(E).join(' | ')+'</div>').join('')||'<div class="card">معامله ندارید.</div>';
let c=d.deals.reduce((s,x)=>s+(Number(x['کمیسیون کل'])||0),0),i=d.deals.reduce((s,x)=>s+(Number(x['سهم من'])||0),0);$('rep').innerHTML='<div class="cards"><div class="card">تعداد معامله<div class="num">'+d.deals.length+'</div></div><div class="card">کمیسیون کل<div class="num">'+c.toLocaleString('fa-IR')+'</div></div><div class="card">سهم من<div class="num">'+i.toLocaleString('fa-IR')+'</div></div></div>';matches()}
function matches(){let s=$('selP');s.innerHTML=d.properties.map(x=>'<option value="'+x.id+'">'+E(x.code||'-')+' — '+E(x.area)+' — '+E(x.meter)+' متر</option>').join('');let p=d.properties.find(x=>String(x.id)===String(s.value));if(!p){$('mt').innerHTML='';return}let a=d.customers.map(c=>{let z=0,w=0,A=(ok,n)=>{w+=n;if(ok)z+=n};A(!c.area||!p.area||p.area.includes(c.area)||c.area.includes(p.area),25);A(!c.minMeter||Number(p.meter)>=Number(c.minMeter),15);A(!c.maxMeter||Number(p.meter)<=Number(c.maxMeter),15);A(!c.minBed||Number(p.bed)>=Number(c.minBed),8);A(!c.maxBed||Number(p.bed)<=Number(c.maxBed),8);A(!c.dealType||c.dealType===p.dealType,15);return[c,Math.round(z/w*100)]}).sort((a,b)=>b[1]-a[1]);$('mt').innerHTML=a.slice(0,10).map(r=>'<div class="card">👤 <b>'+E(r[0].name)+'</b> — '+r[1]+'% تطابق<br>'+E(r[0].phone)+' | '+E(r[0].area)+' | '+E(r[0].dealType)+'</div>').join('')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='amlakman-v2-backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();alert('بازیابی شد')}catch{alert('فایل نامعتبر است')}};r.readAsText(e.target.files[0])}function wipe(){if(confirm('همه اطلاعات حذف شود؟')){d={customers:[],properties:[],followups:[],visits:[],deals:[]};save()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
